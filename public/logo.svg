<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hcm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292b28"/>
      <stop offset="1" stop-color="#3a3c38"/>
    </linearGradient>
    <linearGradient id="hcm-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f5" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#faf9f5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hcm-bg)"/>
  <rect width="64" height="32" rx="16" fill="url(#hcm-shine)"/>
  <!-- audio bars = Half -->
  <g fill="#faf9f5">
    <rect x="12" y="27" width="4.5" height="10" rx="2.25"/>
    <rect x="19.5" y="21" width="4.5" height="22" rx="2.25"/>
    <rect x="27" y="15" width="4.5" height="34" rx="2.25"/>
  </g>
  <!-- code chevron = Code -->
  <path d="M40 22 L51 32 L40 42" fill="none" stroke="#faf9f5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
